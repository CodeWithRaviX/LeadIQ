# ==========================================
# APPLICATION
# ==========================================

spring.application.name=lead-intelligence

server.port=8080


# ==========================================
# DATABASE
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/lead_intelligence
spring.datasource.username=
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# GEMINI AI
# ==========================================

gemini.api.key=
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-1.5-flash


# ==========================================
# OPTIONAL ENRICHMENT API
# ==========================================

enrichment.api.key=
enrichment.api.url=


# ==========================================
# OPTIONAL EMAIL VALIDATION API
# ==========================================

email.validation.api.key=
email.validation.api.url=


# ==========================================
# CORS
# ==========================================

app.frontend.url=http://localhost:5173


# ==========================================
# FILE UPLOAD
# ==========================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ==========================================
# LOGGING
# ==========================================

logging.level.org.springframework.web=INFO
logging.level.com.caprae=INFO
